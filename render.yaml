services:
  - type: web
    name: vera-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      - key: TEAM_NAME
        value: "Vera AI"
      - key: TEAM_MEMBERS
        value: "Deepanshu Pofare"
      - key: VERSION
        value: "2.0.0"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
